<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Secure Verification</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ... Same CSS as before ... */
        :root { --bg-dark:#09090b; --glass:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.08); --neon-blue:#3b82f6; --neon-green:#10b981; --neon-red:#ef4444; }
        body { margin:0; padding:20px; font-family:'Outfit',sans-serif; background:var(--bg-dark); min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; }
        .card { background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--border); width:100%; max-width:380px; padding:40px 30px; border-radius:24px; text-align:center; display:none; animation:floatUp 0.6s ease; }
        .card.active { display:block; }
        @keyframes floatUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .icon-wrapper { width:80px; height:80px; margin:0 auto 25px; border-radius:50%; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; font-size:32px; border:1px solid var(--border); box-shadow:0 0 30px rgba(0,0,0,0.2); }
        .btn { width:100%; padding:16px; border-radius:14px; border:none; font-weight:600; font-size:15px; cursor:pointer; background:linear-gradient(135deg,var(--neon-blue),#2563eb); color:white; margin-top:10px; }
        .btn:disabled { background:#333; cursor:not-allowed; }
        .btn-retry { background:#dc2626; display:none; }
        .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--neon-blue); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px; }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        .timer-val { font-size:28px; font-weight:700; color:var(--neon-green); font-family:monospace; margin-top:5px; }
        .status-error { color:var(--neon-red); border-color:rgba(239,68,68,0.3); }
        .status-success { color:var(--neon-green); border-color:rgba(16,185,129,0.3); }
    </style>
</head>
<body>

    <div id="viewLoad" class="card active"><div class="spinner"></div><p>Checking Security...</p></div>

    <div id="viewStep1" class="card">
        <div class="icon-wrapper status-error"><i class="fas fa-exclamation-triangle"></i></div>
        <h1>Link Expired</h1>
        <p style="color:#aaa;">This link is invalid or expired. Please start again from the App.</p>
        <button class="btn" onclick="window.close()">CLOSE</button>
    </div>

    <div id="viewTrap" class="card">
        <div class="icon-wrapper" style="color:var(--neon-blue)"><i class="fas fa-hourglass-half"></i></div>
        <h1>Security Check</h1>
        <p>Please wait while we verify your session token...</p>
        <button class="btn" id="btnStartTrap" onclick="startTrap()">I AM HUMAN</button>
    </div>

    <div id="viewFinal" class="card">
        <div class="icon-wrapper" id="finalIcon"></div>
        <h1 id="finalTitle"></h1>
        <p id="finalDesc" style="color:#aaa; font-size:14px;"></p>
        <div id="timerArea" style="display:none; background:rgba(0,0,0,0.3); padding:15px; border-radius:12px; margin-bottom:20px;">
            <div style="font-size:10px; color:#888;">ACCESS GRANTED FOR</div>
            <div class="timer-val" id="timerDisplay">00:00:00</div>
        </div>
        <button class="btn" id="finalBtn" onclick="window.close()" style="display:none">Return to App</button>
    </div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyBhdelX3uMxpw_yptph7Wbt2CEd7xbhLgU",
      authDomain: "hankarpin.firebaseapp.com",
      databaseURL: "https://hankarpin-default-rtdb.firebaseio.com",
      projectId: "hankarpin",
      storageBucket: "hankarpin.firebasestorage.app",
      messagingSenderId: "201875395548",
      appId: "1:201875395548:web:00708191e109c2ba5bf519"
    };
    if (!window.firebase || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const MIN_SECONDS = 45; 
    const views = { load:document.getElementById('viewLoad'), step1:document.getElementById('viewStep1'), trap:document.getElementById('viewTrap'), final:document.getElementById('viewFinal') };
    
    function getParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }
    
    function cleanUrl() {
        if(window.history.replaceState) {
            const clean = window.location.href.split('?')[0].split('#')[0];
            window.history.replaceState({}, document.title, clean);
        }
    }

    async function init() {
        // Params from URL (Passed by Shortener)
        const did = getParam('device'); 
        const code = getParam('code'); 
        const uid = getParam('uid'); 
        const token = getParam('token'); 
        
        if(did || code || uid || token) cleanUrl();

        // 1. Check LocalStorage (Already Verified)
        const local = localStorage.getItem('my_app_verification');
        if(local) {
            try { const ld = JSON.parse(local); if(Date.now() < ld.expiry) { showSuccess(ld.expiry, true); return; } } catch(e) {}
        }

        // 2. TOKEN VERIFICATION (Dynamic)
        if(did && code && uid && token) {
            try {
                // Fetch Code Data from Firebase
                const codeRef = database.ref(`users/${uid}/verification_codes/${code}`);
                const snap = await codeRef.once('value');
                const data = snap.val();

                // CHECK 1: Token Match
                // Agar URL ka token Database ke token se match nahi hua -> FAKE LINK
                if(!data || data.secret_token !== token) {
                    showView('step1'); // Invalid Link
                    return;
                }

                // CHECK 2: Start Time (Time Trap)
                // Agar start time nahi hai, to hum abhi set karenge (User just arrived)
                // Note: Is logic mein, user ko page par 45s wait karna hoga.
                if(!data.started_at) {
                    // Set Start Time
                    await codeRef.update({ started_at: firebase.database.ServerValue.TIMESTAMP });
                    showView('trap'); // Show "I am Human" or Wait screen
                    localStorage.setItem('pending_session', JSON.stringify({did, code, uid, token}));
                    return;
                }

                // CHECK 3: Time Elapsed
                const timeTaken = (Date.now() - data.started_at) / 1000;
                if(timeTaken < MIN_SECONDS) {
                    // Agar jaldi aa gaya
                    showView('trap');
                    localStorage.setItem('pending_session', JSON.stringify({did, code, uid, token}));
                    return;
                }

                // Verify
                verifyUser(did, code, uid);

            } catch(e) { showView('step1'); }
            return;
        }
        
        // 3. Trap Button Click Logic (If user is waiting on page)
        const pending = localStorage.getItem('pending_session');
        if(pending) {
             // User wapis aaya ya page refresh kiya
             const p = JSON.parse(pending);
             initSession(p.did, p.code, p.uid, p.token); // Restart check
             return;
        }

        showView('step1');
    }
    
    // Helper to re-run init with stored params
    async function initSession(did, code, uid, token) {
         try {
            const codeRef = database.ref(`users/${uid}/verification_codes/${code}`);
            const data = (await codeRef.once('value')).val();
            
            const timeTaken = (Date.now() - data.started_at) / 1000;
            if(timeTaken < MIN_SECONDS) {
                 // Still waiting
                 showView('trap');
                 const remaining = Math.ceil(MIN_SECONDS - timeTaken);
                 document.getElementById('btnStartTrap').innerText = `PLEASE WAIT ${remaining}s`;
                 document.getElementById('btnStartTrap').disabled = true;
                 
                 // Auto countdown
                 setTimeout(() => initSession(did, code, uid, token), 1000);
                 return;
            }
            verifyUser(did, code, uid);
         } catch(e) {}
    }

    async function startTrap() {
        // Just triggers re-check
        const pending = localStorage.getItem('pending_session');
        if(pending) {
            const p = JSON.parse(pending);
            initSession(p.did, p.code, p.uid, p.token);
        }
    }

    async function verifyUser(did, code, uid) {
        showView('final');
        document.getElementById('finalIcon').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
        document.getElementById('finalTitle').innerText = "Verifying...";
        
        try {
            const ref = database.ref(`users/${uid}/verification_codes/${code}`);
            await ref.update({ used: true, used_at: firebase.database.ServerValue.TIMESTAMP });

            let dur = 86400000;
            const conf = (await database.ref(`users/${uid}/config`).once('value')).val();
            if(conf && conf.verification_minutes) dur = conf.verification_minutes * 60000;
            const expiry = Date.now() + dur;

            await database.ref(`users/${uid}/devices/${did}`).set({ verification_time:Date.now(), expiry_time:expiry, last_code:code });

            localStorage.removeItem('pending_session');
            localStorage.setItem('my_app_verification', JSON.stringify({ did, uid, expiry }));

            showSuccess(expiry);

        } catch(e) { 
            showView('step1');
        }
    }

    function showView(name) {
        Object.values(views).forEach(v => v.classList.remove('active'));
        views[name].classList.add('active');
    }

    function showSuccess(expiry, isRevisit=false) {
        showView('final');
        const icon = document.getElementById('finalIcon');
        icon.className = "icon-wrapper status-success";
        icon.innerHTML = '<i class="fas fa-check"></i>';
        document.getElementById('finalTitle').innerText = "Access Granted";
        document.getElementById('finalDesc').innerText = "Device verified successfully.";
        document.getElementById('timerArea').style.display = 'block';
        document.getElementById('finalBtn').style.display = 'block';
        
        setInterval(() => {
            const diff = expiry - Date.now();
            if(diff<=0) return document.getElementById('timerDisplay').innerText = "00:00:00";
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timerDisplay').innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        }, 1000);
    }

    window.onload = init;
</script>
</body>
</html>
