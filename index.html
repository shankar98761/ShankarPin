<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Verification Status</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg:#09090b; --card:#121217; --neon:#3b82f6; --success:#10b981; --error:#ef4444; }
        body { margin:0; padding:20px; font-family:'Outfit',sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; user-select: none; }
        
        .card { background:rgba(20,20,25,0.6); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); width:100%; max-width:360px; padding:40px 30px; border-radius:24px; text-align:center; display:none; animation:popIn 0.5s ease; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
        .card.active { display:block; }
        @keyframes popIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
        
        .icon-box { width:70px; height:70px; margin:0 auto 20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); }
        .success { color:var(--success); border-color:rgba(16,185,129,0.3); }
        .error { color:var(--error); border-color:rgba(239,68,68,0.3); }
        
        h1 { font-size:20px; margin:10px 0; font-weight:600; }
        p { color:#888; font-size:14px; line-height:1.5; margin-bottom:25px; }
        
        .btn { width:100%; padding:15px; border-radius:12px; border:none; font-weight:600; font-size:14px; cursor:pointer; transition:0.2s; text-transform:uppercase; letter-spacing:1px; }
        .btn-green { background:linear-gradient(135deg, #10b981, #059669); color:white; box-shadow:0 10px 20px -5px rgba(16,185,129,0.4); }
        .btn-red { background:rgba(255,255,255,0.05); color:#ef4444; border:1px solid rgba(239,68,68,0.3); }
        
        .timer-display { background:rgba(0,0,0,0.3); padding:10px; border-radius:10px; margin-bottom:10px; font-family:monospace; font-size:22px; color:var(--success); border:1px solid rgba(16,185,129,0.2); }
        
        /* Device ID Style */
        .did-box { font-size: 11px; color: #555; margin-bottom: 20px; padding: 5px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .did-box:active { color: #fff; background: rgba(255,255,255,0.1); }
        .did-label { font-size: 9px; color: #444; letter-spacing: 1px; display: block; margin-bottom: 2px;}

        .spinner { width:35px; height:35px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--neon); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px; }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        
        /* Toast Notification */
        #toast { visibility: hidden; min-width: 150px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 10px; position: fixed; z-index: 1; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div id="vLoad" class="card active"><div class="spinner"></div><p>Verifying Security Token...</p></div>

    <div id="vError" class="card">
        <div class="icon-box error"><i class="fas fa-shield-halved"></i></div>
        <h1 id="eTitle">Direct Access Denied</h1>
        <p id="eDesc">Please verify using the App only.</p>
        <button class="btn btn-red" onclick="window.close()">CLOSE</button>
    </div>

    <div id="vFinal" class="card">
        <div class="icon-box success"><i class="fas fa-check"></i></div>
        <h1>Verification Success</h1>
        <p style="margin-bottom: 15px;">Access granted successfully.</p>
        
        <div class="timer-display" id="timer">00:00:00</div>
        
        <div class="did-box" id="didArea" ondblclick="copyToClipboard()">
            <span class="did-label">DEVICE ID (DOUBLE TAP TO COPY)</span>
            <span id="didText">LOADING...</span>
        </div>

        <button class="btn btn-green" onclick="openApp()">OPEN APP NOW 🚀</button>
    </div>

    <div id="toast">Copied to Clipboard!</div>

<script>
    // --- FIREBASE CONFIG (Paste Yours) ---
    const firebaseConfig = {
      apiKey: "AIzaSyBhdelX3uMxpw_yptph7Wbt2CEd7xbhLgU",
      authDomain: "hankarpin.firebaseapp.com",
      databaseURL: "https://hankarpin-default-rtdb.firebaseio.com",
      projectId: "hankarpin",
      storageBucket: "hankarpin.firebasestorage.app",
      messagingSenderId: "201875395548",
      appId: "1:201875395548:web:00708191e109c2ba5bf519"
    };

    if (!window.firebase || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- SETTING: 10 MINUTES EXPIRY ---
    const TOKEN_VALIDITY_MINUTES = 10; 

    const views = { load:document.getElementById('vLoad'), err:document.getElementById('vError'), final:document.getElementById('vFinal') };
    
    function openApp() { window.location.href = "rlxpin://verify"; }
    function getParam(n) { return new URLSearchParams(window.location.search).get(n); }

    // --- GENERIC ERROR FUNCTION (Stealth Mode) ---
    // Sabhi errors ke liye same message
    function triggerGenericError() {
        showView('err');
        document.getElementById('eTitle').innerText = "Direct Access Denied";
        document.getElementById('eDesc').innerText = "Please verify using the App only.";
    }

    async function init() {
        const local = localStorage.getItem('my_app_verification');
        if(local) {
            try { 
                const d = JSON.parse(local); 
                if(Date.now() < d.expiry) { 
                    showSuccess(d.expiry, d.did); // Pass DID
                    return; 
                } 
            } catch(e){}
        }

        const accessKey = getParam('access');
        if(accessKey !== 'granted') {
            triggerGenericError();
            return;
        }

        const bridge = localStorage.getItem('secure_bridge_data');
        if(!bridge) {
            triggerGenericError();
            return;
        }

        const data = JSON.parse(bridge);
        
        try {
            const snap = await db.ref(`users/${data.uid}/verification_codes/${data.code}`).once('value');
            const server = snap.val();

            if(!server) { triggerGenericError(); return; } // Time Trap Fail
            if(server.secret_token !== data.token) { 
                localStorage.removeItem('secure_bridge_data');
                triggerGenericError(); return; 
            } // Token Mismatch
            
            if(server.used) { triggerGenericError(); return; } // Expired/Used

            // --- 10 MINUTE EXPIRY CHECK ---
            if (server.started_at) {
                const timeDiff = Date.now() - server.started_at;
                const maxTime = TOKEN_VALIDITY_MINUTES * 60 * 1000;
                
                if (timeDiff > maxTime) {
                    localStorage.removeItem('secure_bridge_data');
                    triggerGenericError(); // Timeout ko bhi Generic Error dikhao
                    return;
                }
            }

            await verifyDevice(data.did, data.code, data.uid);

        } catch(e) { 
            // Internet Error ke liye thoda alag dikha sakte hain ya same, 
            // user ki safety ke liye "Connection Error" better hai
            showView('err');
            document.getElementById('eTitle').innerText = "Connection Error";
            document.getElementById('eDesc').innerText = "Check internet connection.";
        }
    }

    async function verifyDevice(did, code, uid) {
        try {
            await db.ref(`users/${uid}/verification_codes/${code}`).update({ used:true, used_at: firebase.database.ServerValue.TIMESTAMP });
            
            const conf = (await db.ref(`users/${uid}/config`).once('value')).val();
            let duration = (conf && conf.verification_minutes) ? conf.verification_minutes * 60000 : 86400000;
            const expiry = Date.now() + duration;

            await db.ref(`users/${uid}/devices/${did}`).set({ verification_time: Date.now(), expiry_time: expiry, last_code: code });

            localStorage.removeItem('secure_bridge_data');
            localStorage.setItem('my_app_verification', JSON.stringify({ did, uid, expiry }));
            
            showSuccess(expiry, did);
        } catch(e) { triggerGenericError(); }
    }

    function showView(name) { Object.values(views).forEach(v => v.classList.remove('active')); views[name].classList.add('active'); }

    function showSuccess(exp, did) {
        showView('final');
        
        // Show Device ID
        document.getElementById('didText').innerText = did || "UNKNOWN";

        if(window.history.replaceState) {
            const clean = window.location.href.split('?')[0].split('#')[0];
            window.history.replaceState({}, document.title, clean);
        }

        setInterval(() => {
            const diff = exp - Date.now();
            if(diff<=0) return document.getElementById('timer').innerText = "00:00:00";
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timer').innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        }, 1000);
    }

    // Copy Function
    function copyToClipboard() {
        const text = document.getElementById('didText').innerText;
        if(text === "LOADING..." || text === "UNKNOWN") return;
        
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("Copy");
        document.body.removeChild(textArea);
        
        // Show Toast
        const x = document.getElementById("toast");
        x.className = "show";
        setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    window.onload = init;
</script>
</body>
</html>
