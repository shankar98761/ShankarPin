<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Secure Verification</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary:#2563eb; --bg:#f1f5f9; --card:#fff; --text:#1e293b; }
        body { margin:0; padding:16px; font-family:'Inter',sans-serif; background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { background:var(--card); width:100%; max-width:400px; padding:32px 24px; border-radius:24px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.08); display:none; }
        .card.active { display:block; animation:fadeIn 0.5s ease; }
        .icon-box { width:72px; height:72px; border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; font-size:32px; background:#eff6ff; color:var(--primary); }
        h1 { font-size:20px; margin-bottom:8px; color:var(--text); }
        p { font-size:14px; color:#64748b; line-height:1.5; margin-bottom:24px; }
        .btn { width:100%; padding:14px; border-radius:14px; border:none; font-weight:700; background:var(--primary); color:#fff; cursor:pointer; font-size:15px; }
        .btn:disabled { background:#94a3b8; cursor:wait; }
        .loader { width:24px; height:24px; border:3px solid #e2e8f0; border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto; }
        @keyframes spin { to { transform:rotate(360deg); } } @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .state-success .icon-box { background:#dcfce7; color:#16a34a; }
        .state-error .icon-box { background:#fef2f2; color:#dc2626; }
        .timer-box { background:#f8fafc; padding:15px; border-radius:12px; margin-bottom:20px; border:1px solid #e2e8f0; display:none; }
        .t-val { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
        .device-id-display { font-size: 11px; color: #64748b; margin-top: 10px; font-family: monospace; background: #f1f5f9; padding: 5px 10px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>

    <div id="viewLoad" class="card active"><div class="loader"></div><p style="margin-top:15px">Security Check...</p></div>

    <div id="viewStep1" class="card">
        <div class="icon-box"><i class="fas fa-shield-alt"></i></div>
        <h1>Security Check</h1>
        <p>Click below to complete the verification step.</p>
        <button class="btn" id="btnVerifyLink" onclick="goToShortener()">VERIFY NOW</button>
    </div>

    <div id="viewFinal" class="card">
        <div class="icon-box" id="finalIcon"><i class="fas fa-circle-notch fa-spin"></i></div>
        <h1 id="finalTitle">Verifying...</h1>
        <p id="finalDesc">Please wait while we confirm your status.</p>
        
        <div id="timerArea" class="timer-box">
            <div style="font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:5px;letter-spacing:1px;font-weight:700;">ACCESS GRANTED FOR</div>
            <div class="t-val" id="timerDisplay">00:00:00</div>
        </div>
        <div id="didDisplay" class="device-id-display" style="display:none;">ID: ...</div>
        <button class="btn" id="finalBtn" onclick="window.close()" style="display:none; margin-top:20px;">Close Window</button>
        <button class="btn" id="retryBtn" onclick="retryProcess()" style="display:none; background:#dc2626; margin-top:20px;">Retry Verification</button>
    </div>

<script>
    // --- UPDATE YOUR CONFIG HERE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBhdelX3uMxpw_yptph7Wbt2CEd7xbhLgU",
      authDomain: "hankarpin.firebaseapp.com",
      databaseURL: "https://hankarpin-default-rtdb.firebaseio.com",
      projectId: "hankarpin",
      storageBucket: "hankarpin.firebasestorage.app",
      messagingSenderId: "201875395548",
      appId: "1:201875395548:web:00708191e109c2ba5bf519"
    };

    if (!window.firebase || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const MIN_SECONDS_REQUIRED = 30; // Backup Client Check
    
    const vLoad=document.getElementById('viewLoad'), vStep1=document.getElementById('viewStep1'), vFinal=document.getElementById('viewFinal');
    const finalTitle=document.getElementById('finalTitle'), finalDesc=document.getElementById('finalDesc'), finalIcon=document.getElementById('finalIcon');
    let shortenerUrl = "";
    
    function getParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        return urlParams.get(name) || hashParams.get(name);
    }
    
    function cleanAddressBar() {
        if(window.history.replaceState) {
            const clean = window.location.href.split('?')[0].split('#')[0];
            window.history.replaceState({}, document.title, clean);
        }
    }

    async function init() {
        const did = getParam('device'); const code = getParam('code'); const uid = getParam('uid'); const urlKey = getParam('key'); 
        if(did || code || uid || urlKey) cleanAddressBar();

        const localSaved = localStorage.getItem('my_app_verification');
        if(localSaved) {
            try {
                const ld = JSON.parse(localSaved);
                if(Date.now() < ld.expiry) { showSuccess(ld.expiry, ld.did, true); return; }
            } catch(e) { localStorage.removeItem('my_app_verification'); }
        }

        if(did && code && uid) {
            localStorage.setItem('pending_verif', JSON.stringify({ did, code, uid }));
            try {
                const confSnap = await database.ref(`users/${uid}/config`).once('value');
                const conf = confSnap.val();
                if(conf && conf.shortener_api) {
                    shortenerUrl = conf.shortener_api;
                    showView(vStep1);
                } else {
                    verifyUser(did, code, uid); 
                }
            } catch(e) { alert("Connection Error."); showView(vStep1); }
            return;
        }

        const pending = localStorage.getItem('pending_verif');
        if(pending) {
            const data = JSON.parse(pending);
            try {
                const confSnap = await database.ref(`users/${data.uid}/config`).once('value');
                const conf = confSnap.val();
                const realSecret = conf.secret_key || 'v=1';
                if(urlKey !== realSecret) {
                    showError("Access Denied", "Invalid Key. Please restart.");
                    if(conf) shortenerUrl = conf.shortener_api;
                    return;
                }
                const codeRef = database.ref(`users/${data.uid}/verification_codes/${data.code}`);
                const snap = await codeRef.once('value');
                const codeData = snap.val();

                if(!codeData) { showError("Invalid Session", "Restart required."); return; }
                if(!codeData.started_at) {
                    showError("Access Denied", "Please click 'VERIFY NOW' button first.");
                    setTimeout(() => { showView(vStep1); }, 2000);
                    if(conf) shortenerUrl = conf.shortener_api;
                    return;
                }
                verifyUser(data.did, data.code, data.uid);
            } catch(e) { showError("System Error", e.message); }
            return;
        }
        showError("Invalid Link", "Please open from App.");
    }

    async function goToShortener() {
        if(!shortenerUrl) { window.location.reload(); return; }
        document.getElementById('btnVerifyLink').innerText = "Processing...";
        document.getElementById('btnVerifyLink').disabled = true;
        const pending = localStorage.getItem('pending_verif');
        if(pending) {
            const data = JSON.parse(pending);
            try {
                await database.ref(`users/${data.uid}/verification_codes/${data.code}`).update({ started_at: firebase.database.ServerValue.TIMESTAMP });
                window.location.href = shortenerUrl;
            } catch(e) {
                alert("Connection Error.");
                document.getElementById('btnVerifyLink').disabled = false;
            }
        }
    }

    function retryProcess() { window.location.reload(); }

    async function verifyUser(did, code, uid) {
        showView(vFinal);
        try {
            const ref = database.ref(`users/${uid}/verification_codes/${code}`);
            const snap = await ref.once('value');
            const data = snap.val();

            if(!data) throw "Invalid Code";
            if(data.used) throw "Already Verified";

            // --- SERVER SIDE LOCK CHECK ---
            try {
                await ref.update({ used: true, used_at: firebase.database.ServerValue.TIMESTAMP });
            } catch(err) {
                if(err.code === 'PERMISSION_DENIED') {
                    throw "Please wait! Complete the shortener properly.";
                } else { throw err; }
            }

            let dur = 86400000;
            const conf = (await database.ref(`users/${uid}/config`).once('value')).val();
            if(conf && conf.verification_minutes) dur = conf.verification_minutes * 60000;
            const expiry = Date.now() + dur;

            await database.ref(`users/${uid}/devices/${did}`).set({ verification_time:Date.now(), expiry_time:expiry, last_code:code });
            localStorage.removeItem('pending_verif');
            localStorage.setItem('my_app_verification', JSON.stringify({ did, uid, expiry }));
            showSuccess(expiry, did);

        } catch(e) { 
            let msg = e.message || e;
            if(msg.includes("wait") || msg.includes("shortener")) {
                 showError("Too Fast", "Server rejected verification. Did you skip the shortener?");
            } else { showError("Verification Failed", msg); }
        }
    }

    function showView(el) { [vLoad,vStep1,vFinal].forEach(x=>x.style.display='none'); el.style.display='block'; }
    function showSuccess(expiry, deviceId, isRevisit=false) {
        showView(vFinal); document.body.classList.add('state-success');
        finalIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
        finalTitle.innerText = isRevisit ? "Already Verified" : "Verification Success";
        finalDesc.innerText = "You can return to the app now.";
        document.getElementById('timerArea').style.display = 'block';
        document.getElementById('finalBtn').style.display = 'block';
        document.getElementById('retryBtn').style.display = 'none';
        document.getElementById('didDisplay').innerText = "ID: " + deviceId;
        document.getElementById('didDisplay').style.display = 'inline-block';
        setInterval(() => {
            const diff = expiry - Date.now();
            if(diff<=0) return document.getElementById('timerDisplay').innerText = "00:00:00";
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timerDisplay').innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        }, 1000);
    }
    function showError(t, m) {
        showView(vFinal); document.body.classList.add('state-error');
        finalIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
        finalTitle.innerText = t; finalDesc.innerText = m;
        document.getElementById('timerArea').style.display = 'none';
        document.getElementById('didDisplay').style.display = 'none';
        document.getElementById('finalBtn').style.display = 'none';
        document.getElementById('retryBtn').style.display = 'block';
    }
    window.onload = init;
</script>
</body>
</html>
