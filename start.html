<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Redirect</title>
    <style>
        body{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;}
        .loader{border:3px solid #333;border-top:3px solid #00f3ff;border-radius:50%;width:40px;height:40px;animation:spin 0.8s linear infinite;}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
    </style>
</head>
<body>
    <div class="loader"></div>
    <script>
        const p = new URLSearchParams(window.location.search);
        const token = p.get('token');
        const code = p.get('code');
        const uid = p.get('uid');
        const did = p.get('did');
        const target = p.get('target'); 

        if(token && code && target) {
            // Save to LocalStorage
            localStorage.setItem('secure_bridge_data', JSON.stringify({ token, code, uid, did }));
            // Redirect to Shortener
            window.location.href = decodeURIComponent(target);
        } else {
            document.body.innerHTML = "<p style='color:red;text-align:center'>Link Error. Restart App.</p>";
        }
    </script>
</body>
</html>
